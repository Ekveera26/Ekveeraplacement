<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EkVeera Training Center | 15 Days Call Center & Customer Service Training</title>
    
    <!-- मॉडर्न गूगल फॉन्ट्स और फॉन्ट ऑसम आइकन्स -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        @import url('https://googleapis.com');

        :root {
            --primary: #0f172a;        /* स्लेट डार्क - प्रीमियम बेस */
            --accent: #2563eb;         /* इलेक्ट्रिक ब्लू - ब्रांड कलर */
            --accent-glow: rgba(37, 99, 235, 0.15);
            --success: #10b981;        /* एमराल्ड ग्रीन - पेमेंट्स और सक्सेस स्टेट्स */
            --text-main: #1e293b;
            --text-muted: #64748b;
            --bg-light: #f8fafc;
            --glass: rgba(255, 255, 255, 0.85);
            --shadow-md: 0 12px 24px -4px rgba(15, 23, 42, 0.08);
            --shadow-lg: 0 20px 32px -8px rgba(15, 23, 42, 0.12);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* प्रीमियम ग्लासमोर्फिज्म सेक्शन्स */
        section, .premium-card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: var(--radius);
            padding: 2.5rem;
            box-shadow: var(--shadow-md);
            margin-bottom: 2.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        section:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: rgba(37, 99, 235, 0.2);
        }

        /* नेविगेशन बार */
        nav {
            background: rgba(15, 23, 42, 0.95);
            color: white;
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(8px);
        }

        nav .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 1.25rem;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover { color: var(--success); }

        /* हीरो एरिया */
        .hero {
            text-align: center;
            padding: 4rem 1rem;
            background: radial-gradient(circle at top right, rgba(37, 99, 235, 0.08), transparent 50%);
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 1.5rem;
            letter-spacing: -0.03em;
        }

        .hero h1 span {
            background: linear-gradient(135deg, var(--accent), #1d4ed8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* टाइटल्स */
        h2 {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 1.5rem;
            border-left: 5px solid var(--accent);
            padding-left: 0.75rem;
        }

        h3 {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        /* टाइमर ग्रिड */
        .timer-grid {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 2rem 0;
            flex-wrap: wrap;
        }

        .timer-box {
            background: var(--primary);
            color: white;
            min-width: 85px;
            padding: 0.85rem;
            border-radius: 12px;
            text-align: center;
        }

        .timer-box span {
            display: block;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--success);
        }

        .timer-box label { font-size: 0.75rem; opacity: 0.8; }

        /* ग्रिड सिस्टम */
        .grid-cards, .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .feature-card {
            background: #ffffff;
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        /* टाइमलाइन */
        .timeline { position: relative; margin: 2rem 0; }
        .timeline-item { position: relative; padding-left: 3.5rem; margin-bottom: 2rem; }
        .timeline-item::before {
            content: ''; position: absolute; left: 17px; top: 36px; bottom: -32px; width: 2px;
            background: linear-gradient(to bottom, var(--accent), transparent);
        }
        .timeline-item:last-child::before { display: none; }
        .t-num {
            position: absolute; left: 0; top: 0; width: 36px; height: 36px; background: var(--accent);
            color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: 700; box-shadow: 0 0 0 5px rgba(37, 99, 235, 0.15);
        }

        /* इनपुट्स और फॉर्म्स */
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; }
        input[type="text"], input[type="tel"], input[type="email"], select, textarea {
            width: 100%; padding: 0.8rem 1rem; border: 1px solid #cbd5e1; border-radius: 10px;
            background: white; font-size: 0.95rem; transition: all 0.2s;
        }
        input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow); }

        /* बटन्स */
        .cta-btn, button, input[type="submit"] {
            background: linear-gradient(135deg, var(--accent), #1d4ed8);
            color: white; font-weight: 600; padding: 0.8rem 2rem; border-radius: 50px;
            border: none; cursor: pointer; text-decoration: none; display: inline-flex;
            align-items: center; gap: 0.5rem; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            transition: all 0.2s;
        }
        .cta-btn:hover, button:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(37, 99, 235, 0.4); }
        .pulse { animation: pulseGlow 2s infinite; }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.5); }
            70% { box-shadow: 0 0 0 15px rgba(37, 99, 235, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
        }

        /* पेमेंट और क्यूआर */
        .qr-frame { border: 2px dashed rgba(16, 185, 129, 0.4); padding: 1.5rem; border-radius: 12px; background: white; display: inline-block; margin: 1.5rem 0; }
        .upi-box { background: #f1f5f9; padding: 0.75rem 1rem; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; max-width: 350px; margin: 0 auto 1rem auto; }

        /* एकॉर्डियन पैनल */
        .accordion-panel { display: none; margin-top: 1.5rem; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* पादलेख (Footer) */
        footer { background: var(--primary); color: white; padding: 3rem 0; margin-top: 4rem; text-align: center; }
        footer a { color: #94a3b8; text-decoration: none; margin: 0 0.75rem; font-size: 0.85rem; }
        footer a:hover { color: white; }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.2rem; }
            section { padding: 1.5rem; }
            nav .nav-container { flex-direction: column; gap: 0.5rem; }
        }
    </style>
</head>
<body>
