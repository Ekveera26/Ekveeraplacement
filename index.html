     EKVEERA PREMIUM MODERN UI DESIGN (ALL ORIGINAL FUNCTIONS PRESERVED)

  :root {
    --navy: #0B1F3A;
    --navy-deep: #061326;
    --teal: #1F9D95;
    --teal-dark: #11766F;
    --amber: #E9B44C;
    --amber-dark: #D49E35;
    --cream: #F6F8FB;
    --paper: #FFFFFF;
    --ink: #172033;
    --ink-soft: #596579;
    --line: #DCE3EC;
    --radius: 20px;
    --shadow: 0 18px 50px rgba(11,31,58,0.08);
    --display: 'Space Grotesk', sans-serif;
    --body: 'Work Sans', sans-serif;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--body);
    background: var(--cream);
    color: var(--ink);
    line-height: 1.6;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }
  img { max-width: 100%; display: block; }
  .container { max-width: 1140px; margin: 0 auto; padding: 0 24px; }
  h1, h2, h3, h4 { font-family: var(--display); letter-spacing: -0.01em; color: var(--navy); }
  .eyebrow {
    font-family: var(--display);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--teal-dark);
  }

  /* Ringwave Pulse */
  .ringwave { display: flex; align-items: center; gap: 4px; height: 22px; }
  .ringwave span {
    width: 4px; border-radius: 2px; background: var(--amber);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .ringwave span:nth-child(1) { height: 8px; animation-delay: 0s; }
  .ringwave span:nth-child(2) { height: 16px; animation-delay: .15s; }
  .ringwave span:nth-child(3) { height: 22px; animation-delay: .3s; }
  .ringwave span:nth-child(4) { height: 14px; animation-delay: .45s; }
  .ringwave span:nth-child(5) { height: 6px; animation-delay: .6s; }
  @keyframes pulse { 0%, 100% { transform: scaleY(0.5); opacity: .6; } 50% { transform: scaleY(1); opacity: 1; } }

  /* Premium Header */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(11, 31, 58, 0.09);
    box-shadow: 0 5px 25px rgba(11, 31, 58, 0.04);
  }
  .nav { display: flex; align-items: center; justify-content: space-between; min-height: 76px; }
  .brand { display: flex; align-items: center; gap: 12px; font-family: var(--display); font-weight: 700; font-size: 20px; color: var(--navy); }
  .brand-logo { width: 54px; height: 54px; object-fit: contain; }
  .brand-logo-fallback { display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg,var(--navy),var(--teal)); color: var(--amber); font-weight: 700; font-size: 12px; }
  .navlinks { display: flex; gap: 14px; font-weight: 600; font-size: 15px; }
  .navlinks a { color: #334056; padding: 10px 12px; border-radius: 10px; transition: 0.2s ease; }
  .navlinks a:hover { background: #EEF8F7; color: var(--teal-dark); }
  
  /* Modern Button System */
  .btn {
    font-family: var(--body); font-weight: 600; font-size: 15px;
    padding: 14px 24px; border-radius: 12px; display: inline-flex; align-items: center; gap: 8px;
    transition: all 0.25s ease; border: none; cursor: pointer;
  }
  .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(11,31,58,0.12); }
  .btn-primary { background: linear-gradient(135deg, #F0C25E, #E1A33C); color: var(--navy-deep); font-weight: 700; }
  .btn-ghost { border: 1px solid var(--line); color: var(--navy); background: rgba(255,255,255,0.6); }
  .btn-ghost:hover { background: #fff; }
  .btn-whatsapp { background: #25D366; color: #fff; font-weight: 700; }
  .btn-whatsapp:hover { box-shadow: 0 8px 20px rgba(37,211,102,0.3); }

  /* Premium Hero Section */
  .hero {
    background: radial-gradient(circle at 82% 18%, rgba(233,180,76,0.15), transparent 30%),
                radial-gradient(circle at 10% 85%, rgba(31,157,149,0.12), transparent 30%),
                linear-gradient(135deg, #0B1F3A, #061326 75%);
    color: #fff; padding: 80px 0 90px; position: relative; overflow: hidden;
  }
  .hero::before {
    content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 40px 40px; pointer-events: none;

  .hero .container { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 50px; align-items: center; position: relative; z-index: 1; }
  .hero-tag {
    display: inline-flex; align-items: center; gap: 10px;

    color: #8FE3DB; padding: 8px 18px; border-radius: 999px; font-size: 13px; font-weight: 600; margin-bottom: 24px;

  .hero h1 em { font-style: normal; color: var(--amber); }
  .hero p.lead { font-size: 17px; line-height: 1.8; color: #D5DDEA; margin-top: 20px; }
  .hero-stats { display: flex; gap: 0; margin-top: 36px; flex-wrap: wrap; }
  .hero-stats div { padding: 0 30px; border-left: 1px solid rgba(255,255,255,0.15); }
  .hero-stats div:first-child { padding-left: 0; border-left: 0; }
  .hero-stats div strong { display: block; font-family: var(--display); font-size: 28px; color: var(--amber); }
  .hero-stats div span { font-size: 13px; color: #9AA3BC; }

  .hero-candidate-card { border: 1px solid rgba(233,180,76,0.3); border-radius: 28px; overflow: hidden; box-shadow: 0 28px 80px rgba(0,0,0,0.35); }
  .hero-candidate-img { width: 100%; height: auto; aspect-ratio: 1/1; object-fit: cover; }

  /* Shared Sections Layout */
  section { padding: 88px 0; }

  .section-head h2 { font-size: clamp(26px, 4vw, 38px); letter-spacing: -0.02em; position: relative; padding-bottom: 16px; color: var(--navy); }
  .section-head h2::after { content: ""; position: absolute; left: 0; bottom: 0; width: 60px; height: 4px; border-radius: 4px; background: var(--navy); }

  .countdown-banner .container { display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; }
  .countdown-timer { display: flex; gap: 10px; }
  .countdown-timer div { background: var(--navy-deep); color: #fff; border-radius: 10px; padding: 8px 14px; text-align: center; min-width: 58px; }
  .countdown-timer div strong { display: block; font-size: 20px; color: var(--amber); }
  .countdown-timer div span { font-size: 11px; color: #C9CFE0; }

  /* Premium Cards & Containers */
  .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
  .card, .office-card, .faq-item, .fee-card { background: var(--paper); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); transition: all 0.3s ease; }

  .card p { color: var(--ink-soft); font-size: 15px; }

  .card input[type="text"], .card input[type="password"], .card input[type="number"], .card textarea, .card input[type="file"] {
    width: 100%; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; font-family: var(--body); font-size: 15px; background: #FAFBFD; transition: all 0.2s ease;
  }
  .card input:focus, .card textarea:focus { outline: none; border-color: var(--teal); background: #fff; box-shadow: 0 0 0 4px rgba(31,157,149,0.1); }
  .card label { display: block; font-size: 14px; font-weight: 600; color: var(--navy); margin-bottom: 6px; }

  /* Curriculum Timeline */
  .timeline { border-left: 2px solid #9DD9D5; margin-left: 8px; padding-left: 12px; }
