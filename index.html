<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EkVeera Training Center | Premium Call Center Training</title>
    
    <!-- मॉडर्न गूगल फॉन्ट्स और फॉन्ट ऑसम आइकन्स -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        @import url('https://googleapis.com');

        :root {
            --bg-dark: #090d16;        /* अल्ट्रा मॉडर्न डार्क बैकग्राउंड */
            --panel-dark: #111827;     /* कार्ड्स के लिए गहरा रंग */
            --accent: #3b82f6;         /* नियॉन इलेक्ट्रिक ब्लू */
            --accent-glow: #1d4ed8;
            --success: #10b981;        /* एमराल्ड ग्रीन */
            --text-light: #f8fafc;     /* सफेद चमकीला टेक्स्ट */
            --text-muted: #94a3b8;     /* धीमा टेक्स्ट */
            --glass: rgba(17, 24, 39, 0.7);
            --border-glass: rgba(255, 255, 255, 0.08);
            --radius-lg: 24px;
            --radius-md: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
            overflow-x: hidden;
            /* बैकग्राउंड में प्रीमियम ग्लो इफेक्ट्स */
            background-image: 
                radial-gradient(circle at 90% 10%, rgba(59, 130, 246, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 10% 80%, rgba(16, 185, 129, 0.08) 0%, transparent 45%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* 🌐 न्यू ऐज नेविगेशन बार */
        nav {
            background: rgba(9, 13, 22, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-glass);
            padding: 1.2rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        nav .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 1.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        nav .nav-links a:hover {
            color: var(--text-light);
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        /* 🚀 अल्टीमेट हीरो सेक्शन */
        .hero {
            text-align: center;
            padding: 7rem 1rem 5rem 1rem;
            position: relative;
        }

        .badge-online {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #60a5fa;
            padding: 0.4rem 1.2rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 1.5rem;
            letter-spacing: 0.05em;
        }

        .hero h1 {
            font-size: 3.8rem;
            font-weight: 800;
            color: var(--text-light);
            margin-bottom: 1.5rem;
            letter-spacing: -0.04em;
            line-height: 1.15;
        }

        .hero h1 span {
            background: linear-gradient(135deg, #3b82f6, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 1.25rem;
            color: var(--text-muted);
            max-width: 750px;
            margin: 0 auto 3rem auto;
            font-weight: 400;
        }

        /* ⚡ सुपर कस्टमाइज्ड ग्लासमोर्फिज्म कार्ड्स */
        section, .premium-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 3rem;
            margin-bottom: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        section:hover {
            transform: translateY(-6px);
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: 0 30px 60px -10px rgba(59, 130, 246, 0.15);
        }

        /* सेक्शन टाइटल्स */
        h2 {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-light);
            margin-bottom: 2rem;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        h2::before {
            content: '';
            width: 6px;
            height: 32px;
            background: linear-gradient(to bottom, var(--accent), var(--success));
            border-radius: 99px;
            display: inline-block;
        }

        /* ⏱️ भविष्य जैसा (Futuristic) काउंटडाउन और स्टैट्स ग्रिड */
        .timer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 1rem;
            margin: 3rem 0;
        }

        .timer-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            padding: 1.25rem;
            border-radius: var(--radius-md);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .timer-box::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, var(--accent), transparent);
        }

        .timer-box span {
            display: block;
            font-size: 2.4rem;
            font-weight: 800;
            color: var(--text-light);
            line-height: 1;
            margin-bottom: 0.3rem;
        }

        .timer-box label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        /* ग्रिड लेआउट */
        .grid-3, .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .feature-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-glass);
            padding: 2rem;
            border-radius: var(--radius-md);
            transition: all 0.3s;
        }

        .feature-card:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255,255,255,0.15);
        }

        /* 🗺️ मॉडर्न टाइमलाइन डिज़ाइन */
        .timeline { position: relative; margin: 3rem 0; }
        .timeline-item { position: relative; padding-left: 4.5rem; margin-bottom: 2.5rem; }
        .timeline-item::before {
            content: ''; position: absolute; left: 22px; top: 44px; bottom: -36px; width: 2px;
            background: linear-gradient(to bottom, var(--accent), transparent);
        }
        .timeline-item:last-child::before { display: none; }
        
        .t-num {
            position: absolute; left: 0; top: 0; width: 44px; height: 44px; 
            background: linear-gradient(135deg, var(--accent), var(--accent-glow));
            color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 1.1rem; box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }

        /* 📋 नया फॉर्म और इनपुट स्टाइल (Dark Dashboard Feel) */
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; color: #cbd5e1; }
        
        input[type="text"], input[type="tel"], input[type="email"], input[type="password"], select, textarea {
            width: 100%; padding: 0.9rem 1.2rem; background: rgba(0, 0, 0, 0.3); 
            border: 1px solid var(--border-glass); border-radius: var(--radius-md);
            color: var(--text-light); font-size: 0.95rem; transition: all 0.3s;
        }
        input:focus, select:focus { 
            outline: none; border-color: var(--accent); 
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.25); 
        }

        /* 🔘 हाई-एंड एनिमेटेड बटन्स */
        .cta-btn, button, input[type="submit"] {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white; font-weight: 700; padding: 1rem 2.5rem; border-radius: 9999px;
            border: none; cursor: pointer; text-decoration: none; display: inline-flex;
            align-items: center; gap: 0.6rem; box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-size: 0.95rem;
        }
        
        .cta-btn:hover, button:hover { 
            transform: scale(1.04); 
            box-shadow: 0 12px 28px rgba(37, 99, 235, 0.5); 
        }
        
        .pulse { animation: neonPulse 2s infinite; }
        @keyframes neonPulse {
